services:
  backend:
    build: ./backend
    container_name: health-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:8000"
    volumes:
      - ./data:/app/data
      - /home/kouki/.claude:/home/kouki/.claude:ro
    environment:
      - APP_USERNAME=${APP_USERNAME:-user}
      - APP_DOMAIN=${APP_DOMAIN:-localhost:8401}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_USER=${LASTFM_USER}
      - DATABASE_PATH=/app/data/health.db
      - FETCH_INTERVAL_HOURS=${FETCH_INTERVAL_HOURS:-6}
      # Phase 2
      - OURA_PERSONAL_ACCESS_TOKEN=${OURA_PERSONAL_ACCESS_TOKEN:-}
      - INTERVALS_API_KEY=${INTERVALS_API_KEY:-}
      - INTERVALS_ATHLETE_ID=${INTERVALS_ATHLETE_ID:-}
      - KASHIDASHI_BASE_URL=${KASHIDASHI_BASE_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Strava のトークン更新は strava-autopilot（ゲートウェイ）に一本化
      - STRAVA_GATEWAY_URL=${STRAVA_GATEWAY_URL:-}
      - STRAVA_GATEWAY_API_KEY=${STRAVA_GATEWAY_API_KEY:-}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - GCAL_PRIVATE_CALENDAR_ID=${GCAL_PRIVATE_CALENDAR_ID:-}
      - GCAL_LIVE_CALENDAR_ID=${GCAL_LIVE_CALENDAR_ID:-}
      # Phase 3
      - SYNC_GATEWAY_BASE_URL=${SYNC_GATEWAY_BASE_URL:-}
      - CLAUDE_PROJECTS_DIR=/home/kouki/.claude/projects
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_USER=${GITHUB_USER:-}
      # NextDNS
      - NEXTDNS_API_KEY=${NEXTDNS_API_KEY:-}
      - NEXTDNS_PROFILE_ID=${NEXTDNS_PROFILE_ID:-}
      - OUTING_HOME_CITIES=${OUTING_HOME_CITIES:-}
      # Stash
      - STASH_API_URL=${STASH_API_URL:-http://172.17.0.1:9999}
      - STASH_API_KEY=${STASH_API_KEY:-}
      # Steam Web API
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STEAM_ID64=${STEAM_ID64:-}
      # 写真 (Immich + photo-genka)
      - IMMICH_API_URL=${IMMICH_API_URL:-http://172.17.0.1:2283}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      - PHOTO_GENKA_API_URL=${PHOTO_GENKA_API_URL:-http://172.17.0.1:8403}
      # Duolingo (公開プロフィールAPI, 認証不要)
      - DUOLINGO_USER_ID=${DUOLINGO_USER_ID:-}
      - DUOLINGO_XP_PER_MINUTE=${DUOLINGO_XP_PER_MINUTE:-3.0}
      # Notification
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_BOT_BASIC_ID=${LINE_BOT_BASIC_ID:-}
      - PERSONAL_LINE_URL=${PERSONAL_LINE_URL:-}
      - NOTIFICATION_ENABLED=${NOTIFICATION_ENABLED:-false}
      # 主観フィードバック（本人のみに毎晩LINEで質問）
      - LINE_OWNER_USER_ID=${LINE_OWNER_USER_ID:-}
      - SUBJECTIVE_PUSH_HOUR_UTC=${SUBJECTIVE_PUSH_HOUR_UTC:-12}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: health-frontend
    restart: unless-stopped
    ports:
      - "8401:80"
    depends_on:
      - backend
